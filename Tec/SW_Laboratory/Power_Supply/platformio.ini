[env:genericCH32V006K8U6]
platform = ch32v
board = genericCH32V006K8U6
framework = noneos-sdk
upload_protocol = wch-link
monitor_speed = 115200

build_flags =
    -D CH32V00x
    -D USE_STDPERIPH_DRIVER